<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Olivia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #FDF6EE;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px 70px;
      color: #2C1A0E;
    }

    h1 {
      font-size: 2rem;
      color: #8B4513;
      margin-bottom: 1.5rem;
      letter-spacing: 0.02em;
    }

    .note {
      background: #fff;
      border: 1px solid #e8d5c4;
      border-radius: 14px;
      padding: 1.8rem 2.2rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 2px 14px rgba(139,69,19,0.08);
      font-size: 1.05rem;
      line-height: 1.9;
      color: #4a2e1a;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .note p + p { margin-top: 0.8rem; }

    .wheel-hint {
      font-style: italic;
      color: #8B4513;
      margin-bottom: 1.2rem;
      font-size: 0.95rem;
    }

    .wheel-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 1.4rem;
    }

    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 24px solid #8B4513;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
      z-index: 5;
    }

    #wheel {
      display: block;
      border-radius: 50%;
      box-shadow: 0 4px 22px rgba(139,69,19,0.22);
      cursor: pointer;
    }

    .spin-btn {
      display: inline-block;
      background: #8B4513;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 0.75rem 2.8rem;
      font-family: Georgia, serif;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.18s;
      margin-bottom: 1.5rem;
    }

    .spin-btn:hover:not(:disabled) { background: #6b3010; }
    .spin-btn:disabled { background: #c9a98a; cursor: default; }

    .result {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-pill {
      border: 2px solid #8B4513;
      border-radius: 50px;
      padding: 0.6rem 2.2rem;
      font-size: 1.15rem;
      color: #8B4513;
      font-style: italic;
      background: #fff;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .result-pill.show {
      opacity: 1;
      transform: translateY(0);
    }

    .see-all-btn {
      display: none;
      margin: 1.2rem auto 0;
      background: transparent;
      color: #8B4513;
      border: 2px solid #8B4513;
      border-radius: 50px;
      padding: 0.65rem 2.2rem;
      font-family: Georgia, serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }

    .see-all-btn:hover { background: #8B4513; color: #fff; }

    .see-all-btn.visible { display: inline-block; }

    .all-attrs {
      display: none;
      max-width: 520px;
      width: 100%;
      background: #fff;
      border: 1px solid #e8d5c4;
      border-radius: 14px;
      padding: 1.6rem 2rem;
      margin-top: 1.4rem;
      box-shadow: 0 2px 14px rgba(139,69,19,0.08);
      text-align: left;
    }

    .all-attrs.visible { display: block; }

    .all-attrs h3 {
      font-size: 1rem;
      color: #8B4513;
      margin-bottom: 1rem;
      font-style: italic;
      text-align: center;
    }

    .all-attrs ul {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem 1.2rem;
    }

    .all-attrs li {
      font-size: 0.95rem;
      color: #4a2e1a;
      padding-left: 1.1rem;
      position: relative;
    }

    .all-attrs li::before {
      content: '🌹';
      position: absolute;
      left: -0.3rem;
      font-size: 0.75rem;
      top: 0.1rem;
    }

    .sig {
      margin-top: 2.5rem;
      color: #9a7060;
      font-style: italic;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h1>🌸 For Olivia 🌸</h1>

  <div class="note">
    <p>I have really enjoyed getting to know you, and its clear you're an exceptional person.</p>
    <p>There are so many things I admire about you — give the wheel a spin to discover them one by one.</p>
  </div>

  <p class="wheel-hint">Click the wheel or the button to spin</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="380" height="380" onclick="spin()"></canvas>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">Spin</button>

  <div class="result">
    <span class="result-pill" id="pill"></span>
  </div>

  <button class="see-all-btn" id="seeAllBtn" onclick="toggleAll()">See all</button>

  <div class="all-attrs" id="allAttrs">
    <h3>Everything I admire about you</h3>
    <ul id="attrList"></ul>
  </div>

  <div class="sig">— James</div>

  <script>
    const ATTRS = [
      'Smart', 'Beautiful', 'Friendly', 'Athletic', 'Classy',
      'Sense of Humour', 'Appreciates Poetry', 'Honest', 'Open Minded',
      'Ambitious', 'Thoughtful', 'Faith-Driven', 'Family Orientated',
      'Knowledgeable', 'Kind', 'Not a Snob (despite Mosman)',
      'Drop Dead Gorgeous', 'Always Dresses Well'
    ];

    const PALETTE = ['#8B4513','#C8733A','#A05828'];
    const N = ATTRS.length;
    const ARC = (2 * Math.PI) / N;

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const CX = canvas.width / 2;
    const CY = canvas.height / 2;
    const R = CX - 4;

    let rot = 0;
    let spinning = false;
    let spinCount = 0;

    // Populate the "See all" list once
    const attrList = document.getElementById('attrList');
    ATTRS.forEach(a => {
      const li = document.createElement('li');
      li.textContent = a;
      attrList.appendChild(li);
    });

    function toggleAll() {
      const box = document.getElementById('allAttrs');
      const btn = document.getElementById('seeAllBtn');
      const showing = box.classList.toggle('visible');
      btn.textContent = showing ? 'Hide' : 'See all';
    }

    function draw(r) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < N; i++) {
        const a0 = r + i * ARC;
        const a1 = a0 + ARC;

        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, R, a0, a1);
        ctx.closePath();
        ctx.fillStyle = PALETTE[i % PALETTE.length];
        ctx.fill();
        ctx.strokeStyle = 'rgba(253,246,238,0.55)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(a0 + ARC / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,255,255,0.94)';

        const label = ATTRS[i];
        const maxW = R - 28;
        let fontSize = 11;
        ctx.font = `bold ${fontSize}px Georgia, serif`;
        while (ctx.measureText(label).width > maxW && fontSize > 7) {
          fontSize--;
          ctx.font = `bold ${fontSize}px Georgia, serif`;
        }

        ctx.shadowColor = 'rgba(0,0,0,0.45)';
        ctx.shadowBlur = 3;
        ctx.fillText(label, R - 12, 4);
        ctx.restore();
      }

      // hub
      ctx.beginPath();
      ctx.arc(CX, CY, 22, 0, 2 * Math.PI);
      ctx.fillStyle = '#FDF6EE';
      ctx.fill();
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#8B4513';
      ctx.font = '15px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('♡', CX, CY + 1);
    }

    function spin() {
      if (spinning) return;
      spinning = true;

      const btn = document.getElementById('spinBtn');
      const pill = document.getElementById('pill');
      btn.disabled = true;
      pill.classList.remove('show');

      const target = Math.floor(Math.random() * N);

      // angle that puts the centre of segment `target` at the top pointer (-π/2)
      const baseAngle = -Math.PI / 2 - target * ARC - ARC / 2;
      const minFinal = rot + 6 * 2 * Math.PI;
      const k = Math.ceil((minFinal - baseAngle) / (2 * Math.PI));
      const finalRot = baseAngle + 2 * Math.PI * k;

      const duration = 4400;
      const t0 = performance.now();
      const r0 = rot;

      function easeOut(t) { return 1 - Math.pow(1 - t, 3.8); }

      function frame(now) {
        const t = Math.min((now - t0) / duration, 1);
        rot = r0 + (finalRot - r0) * easeOut(t);
        draw(rot);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          rot = finalRot;
          spinning = false;
          btn.disabled = false;
          pill.textContent = ATTRS[target];
          pill.classList.add('show');
          rainWords(ATTRS[target]);
          spinCount++;
          if (spinCount >= 1) {
            document.getElementById('seeAllBtn').classList.add('visible');
          }
        }
      }

      requestAnimationFrame(frame);
    }

    function rainWords(word) {
      const items = [];
      for (let i = 0; i < 22; i++) items.push({ text: word, isRose: false });
      for (let i = 0; i < 18; i++) items.push({ text: '🌹', isRose: true });

      items.forEach(({ text, isRose }) => {
        const el = document.createElement('span');
        el.textContent = text;
        el.style.cssText = `
          position: fixed;
          top: -2.5rem;
          left: ${3 + Math.random() * 94}vw;
          font-family: Georgia, serif;
          font-size: ${isRose ? 1.1 + Math.random() * 0.9 : 0.85 + Math.random() * 0.7}rem;
          color: #8B4513;
          opacity: ${0.55 + Math.random() * 0.45};
          pointer-events: none;
          white-space: nowrap;
          z-index: 999;
          font-style: italic;
        `;
        document.body.appendChild(el);

        const delay = Math.random() * 2200;
        const dur = 1800 + Math.random() * 1600;
        const swing = (Math.random() - 0.5) * 80;
        const rot0 = (Math.random() - 0.5) * 30;
        const rot1 = (Math.random() - 0.5) * 30;

        el.animate([
          { transform: `translateY(0) translateX(0) rotate(${rot0}deg)`, opacity: el.style.opacity },
          { transform: `translateY(110vh) translateX(${swing}px) rotate(${rot1}deg)`, opacity: 0 }
        ], { delay, duration: dur, easing: 'ease-in', fill: 'forwards' })
          .finished.then(() => el.remove());
      });
    }

    draw(rot);
  </script>

</body>
</html>
